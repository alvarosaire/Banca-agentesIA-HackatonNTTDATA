# Tema del panel (mismo sistema visual que /chat y /login): neutro frío, un solo acento azul petróleo.
[theme]
base = "light"
primaryColor = "#0F4C5C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F6"
textColor = "#0F1A1F"
borderColor = "#E3E7EB"
dataframeBorderColor = "#E9ECEF"
dataframeHeaderBackgroundColor = "#F3F5F7"
dataframeHeaderTextColor = "#5B6770"
linkColor = "#0F4C5C"
linkUnderline = false
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap, Segoe UI, system-ui, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap, Cascadia Mono, Consolas, monospace"
baseFontSize = 16
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
codeBackgroundColor = "#F1F3F5"
codeTextColor = "#0F1A1F"
greenColor = "#1E7A4F"
orangeColor = "#9A6200"
redColor = "#B3362F"
blueColor = "#0F4C5C"
grayColor = "#5B6770"
chartCategoricalColors = ["#0F4C5C", "#9AA5AE", "#5E97A6", "#C9D1D7"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
